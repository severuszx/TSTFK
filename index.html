<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Slow Tide · 反馈中心</title>
<script>
(function(){
// 主题：浅色 / 深色，localStorage 优先，默认浅色（与官网一致）
var mode = 'light';
try { mode = localStorage.getItem('tstfb-theme'); } catch (e) {}
if (mode !== 'dark' && mode !== 'light') { mode = 'light'; }
document.documentElement.setAttribute('data-theme', mode);
document.documentElement.lang = 'zh-CN';
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f3f5f8;
  --text:#1f2937;
  --text-secondary:#5b6675;
  --border:#e2e8f0;
  --card:#ffffff;
  --hover:#eef2f7;
  --header-bg:rgba(255,255,255,.92);
  --primary:#0f172a;
  --accent:#52525b;
  --accent-soft:rgba(82,82,91,.1);
  --shadow:0 4px 14px rgba(15,23,42,.07);
  --hero-grad:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  --danger:#b91c1c;
  --info:#1d4ed8;
  --success:#15803d;
  --tag-pending-bg:#f1f5f9;
  --tag-pending-text:#475569;
  --tag-doing-bg:#dbeafe;
  --tag-doing-text:#1e40af;
  --tag-done-bg:#dcfce7;
  --tag-done-text:#166534;
}
html[data-theme="dark"]{
  --bg:#111113;
  --text:#e5e5e7;
  --text-secondary:#9a9aa0;
  --border:#26262b;
  --card:#18181b;
  --hover:#222226;
  --header-bg:rgba(17,17,19,.92);
  --primary:#f4f4f5;
  --accent:#a1a1aa;
  --accent-soft:rgba(161,161,170,.14);
  --shadow:0 4px 14px rgba(0,0,0,.5);
  --hero-grad:linear-gradient(135deg,#0a0a0b 0%,#18181b 100%);
  --danger:#f87171;
  --info:#93c5fd;
  --success:#4ade80;
  --tag-pending-bg:#26262b;
  --tag-pending-text:#a1a1aa;
  --tag-doing-bg:#1e3a5f;
  --tag-doing-text:#bfdbfe;
  --tag-done-bg:#14532d;
  --tag-done-text:#bbf7d0;
}
html[data-theme="dark"] .btn-primary{background:#71717a;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;
  min-height:100vh;
}
.container{max-width:960px;margin:0 auto;padding:0 16px;}
a{color:var(--accent);}
button{font-family:inherit;}

/* ===== 顶部导航（官网同款） ===== */
.site-header{
  position:sticky;top:0;z-index:100;
  background:var(--header-bg);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  display:flex;align-items:center;gap:18px;
  min-height:62px;
  flex-wrap:wrap;
}
.logo{
  font-size:19px;font-weight:700;color:var(--primary);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.logo-mark{
  width:34px;height:34px;border-radius:6px;
  background:var(--hero-grad);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;flex:none;
}
.logo-img{
  width:34px;height:34px;border-radius:6px;
  object-fit:cover;flex:none;display:block;
  border:1px solid var(--border);
}
html[data-theme="dark"] .logo-img{filter:invert(1);}
.main-nav{
  display:flex;gap:2px;flex:1;flex-wrap:wrap;
}
.nav-link{
  padding:8px 12px;border-radius:6px;border:none;background:transparent;
  color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;
}
.nav-link:hover{background:var(--hover);}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.header-right{
  display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;
}
/* 主题切换开关（官网同款滑块） */
.theme-toggle{
  position:relative;width:54px;height:28px;flex:none;
  border:1px solid var(--border);background:var(--card);
  border-radius:14px;cursor:pointer;padding:0;overflow:hidden;
}
.theme-toggle .tt-ic{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:13px;line-height:1;pointer-events:none;
}
.theme-toggle .tt-sun{left:8px;opacity:.75;}
.theme-toggle .tt-moon{right:8px;opacity:.75;}
.theme-toggle .tt-thumb{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;transition:left .28s cubic-bezier(.4,0,.2,1),background-color .28s;
}
html[data-theme="dark"] .theme-toggle .tt-thumb{left:29px;}
body,.site-header,.card,.fb-card,.admin-item,.admin-bar,.btn,.nav-link,.theme-toggle,.toast{
  transition:background-color .3s ease,color .3s ease,border-color .3s ease;
}

/* ===== 通用 ===== */
.section{padding:22px 0 8px;}
.section-title{
  display:flex;align-items:center;gap:10px;
  font-size:19px;font-weight:700;margin-bottom:14px;color:var(--primary);
}
.section-title::before{
  content:'';width:5px;height:20px;border-radius:0;background:var(--accent);
}
.view{display:none;}
.view.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:18px;box-shadow:var(--shadow);margin:12px 0;
}
.card h2{font-size:16px;margin-bottom:10px;}
.btn{
  padding:8px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;font-size:14px;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;min-height:38px;
}
.btn:hover{background:var(--hover);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
html[data-theme="dark"] .btn.primary{background:#71717a;border-color:#71717a;}
.btn.primary:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

/* ===== 表单 ===== */
.form-item{margin:12px 0;}
.form-label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px;}
.form-label .req{color:var(--danger);}
.form-item input[type="text"],
.form-item input[type="password"],
.form-item textarea,
.form-item select{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--card);color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
.form-item input:focus,.form-item textarea:focus,.form-item select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.form-item textarea{min-height:110px;resize:vertical;}
.tip-msg{
  min-height:20px;font-size:13px;margin:6px 0;color:var(--text-secondary);
}
.tip-msg.error{color:var(--danger);}
.tip-msg.ok{color:var(--success);}

/* ===== 列表 ===== */
.list-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;}
.list-toolbar input[type="text"]{
  flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--card);color:var(--text);font-size:14px;outline:none;
}
.list-toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.list-toolbar select{
  padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--card);color:var(--text);font-size:14px;font-family:inherit;outline:none;
}
.fb-card{
  padding:14px 16px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  margin:10px 0;cursor:pointer;box-shadow:var(--shadow);
  transition:border-color .15s ease;
}
.fb-card:hover{border-color:var(--accent);}
.fb-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.fb-no{font-weight:700;font-size:14px;font-family:ui-monospace,Consolas,monospace;color:var(--primary);}
.fb-type{font-size:12px;color:var(--text-secondary);}
.fb-status{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600;}
.fb-status.pending{background:var(--tag-pending-bg);color:var(--tag-pending-text);}
.fb-status.doing{background:var(--tag-doing-bg);color:var(--tag-doing-text);}
.fb-status.done{background:var(--tag-done-bg);color:var(--tag-done-text);}
.fb-time{font-size:12px;color:var(--text-secondary);margin-left:auto;}
.fb-desc{
  font-size:14px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.fb-thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.fb-thumbs img{
  width:64px;height:64px;object-fit:cover;
  border-radius:6px;border:1px solid var(--border);
}
.empty{padding:34px 16px;text-align:center;color:var(--text-secondary);font-size:14px;}

/* ===== 详情 ===== */
.detail-meta{margin:10px 0;}
.detail-meta .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0;font-size:14px;}
.detail-meta .row .k{color:var(--text-secondary);flex:none;}
.detail-body{
  margin:14px 0;
  padding:14px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}
.gallery{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.gallery img{
  width:130px;height:130px;object-fit:cover;
  border-radius:8px;border:1px solid var(--border);
  cursor:zoom-in;
}
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.82);
  display:none;align-items:center;justify-content:center;z-index:200;
  padding:20px;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;}
.reply-box{margin:12px 0;}
.reply-box .k{font-size:13px;color:var(--text-secondary);margin-bottom:6px;}
.reply-text{font-size:14px;white-space:pre-wrap;word-break:break-word;}
.reply-empty{font-size:13px;color:var(--text-secondary);}

/* ===== 管理 ===== */
.admin-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  box-shadow:var(--shadow);margin:12px 0;
}
.admin-bar .who{font-size:13px;color:var(--text-secondary);}
.admin-item{
  padding:14px 16px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);margin:10px 0;
}
.admin-item .fb-head{margin-bottom:8px;}
.admin-item textarea{
  width:100%;min-height:70px;
  padding:9px 11px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;
  resize:vertical;margin:8px 0;outline:none;
}
.admin-item textarea:focus{border-color:var(--accent);}
.admin-item .save-btn{min-height:36px;padding:6px 14px;}

/* ===== 图片上传 ===== */
.img-upload{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.img-cell{position:relative;}
.img-cell img{
  width:90px;height:90px;object-fit:cover;
  border-radius:8px;border:1px solid var(--border);
  display:block;
}
.img-cell .del{
  position:absolute;top:-8px;right:-8px;
  width:22px;height:22px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:13px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.img-add{
  width:90px;height:90px;
  border:1px dashed var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--text-secondary);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.img-add:hover{background:var(--hover);color:var(--text);}

/* ===== Toast / 页脚 ===== */
.toast{
  position:fixed;left:50%;bottom:34px;
  transform:translateX(-50%);
  background:var(--primary);color:var(--bg);
  padding:9px 18px;border-radius:6px;
  font-size:14px;box-shadow:var(--shadow);
  opacity:0;transition:opacity .25s;
  z-index:300;pointer-events:none;
  max-width:calc(100vw - 40px);
  text-align:center;
}
.toast.show{opacity:1;}
.site-footer{
  margin-top:40px;padding:30px 0 18px;border-top:1px solid var(--border);
  background:var(--card);
}
.footer-grid{
  display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:26px;
  padding-bottom:20px;border-bottom:1px solid var(--border);
}
.footer-col h4{
  font-size:14px;font-weight:700;margin-bottom:10px;color:var(--primary);
}
.footer-col p{
  font-size:13px;color:var(--text-secondary);line-height:1.7;
}
.footer-links{list-style:none;font-size:13px;color:var(--text-secondary);line-height:2;}
.footer-links button{
  border:none;background:none;color:var(--text-secondary);cursor:pointer;padding:0;font-size:13px;
}
.footer-links button:hover{color:var(--accent);}
.footer-links a{color:var(--accent);text-decoration:none;}
.footer-links a:hover{text-decoration:underline;}
.footer-bottom{
  padding-top:14px;text-align:center;color:var(--text-secondary);font-size:12px;
}
@media(max-width:720px){
  .footer-grid{grid-template-columns:1fr;gap:16px;}
}

@media(max-width:720px){
  .header-inner{gap:10px;}
  .main-nav{order:3;flex-basis:100%;}
  .logo{font-size:17px;}
  .card{padding:14px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
</head>

<main>
  <!-- 提交 -->
  <section id="view-submit" class="view active">
    <div class="container">
      <div class="section"><div class="section-title" data-i18n="submitTitle">提交反馈</div></div>
      <div class="card">
        <div class="form-item">
          <label class="form-label" for="f-gameid"><span class="req">*</span> <span data-i18n="fGameId">游戏ID</span></label>
          <input type="text" id="f-gameid" maxlength="32" autocomplete="off">
        </div>
        <div class="form-item">
          <label class="form-label" for="f-type"><span class="req">*</span> <span data-i18n="fType">反馈类型</span></label>
          <select id="f-type">
            <option value="bug" data-i18n="typeBug">BUG问题</option>
            <option value="cheat" data-i18n="typeCheat">外挂作弊</option>
            <option value="destroy" data-i18n="typeDestroy">恶意破坏</option>
            <option value="suggest" data-i18n="typeSuggest">玩法建议</option>
            <option value="appeal" data-i18n="typeAppeal">处罚申诉</option>
            <option value="other" data-i18n="typeOther">其他</option>
          </select>
        </div>
        <div class="form-item">
          <label class="form-label" for="f-desc"><span class="req">*</span> <span data-i18n="fDesc">问题描述</span></label>
          <textarea id="f-desc" maxlength="2000"></textarea>
        </div>
        <div class="form-item">
          <label class="form-label" for="f-time" data-i18n="fTime">发生时间</label>

/* ================================================================
 * 数据层：Cloudflare Pages Functions + D1（云模式） + localStorage（本地模式）
 * ================================================================ */
function isCloud(){ return !!(SUPABASE.url && SUPABASE.anonKey); }

function cloudHeaders(){
  return {
    'apikey': SUPABASE.anonKey,
    'Authorization': 'Bearer ' + SUPABASE.anonKey,
    'Content-Type': 'application/json'
  };
}
function cloudGet(path){
  return fetch(SUPABASE.url + path, { headers: cloudHeaders() }).then(function(r){
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return r.json();
  });
}
function cloudPost(path, body, headers){
  var h = headers || cloudHeaders();
  return fetch(SUPABASE.url + path, {
    method: 'POST',
    headers: h,
    body: body
  }).then(function(r){
    if (!r.ok) {
      return r.text().then(function(txt){
        var parsed = null;
        try { parsed = JSON.parse(txt); } catch (e) {}
        var err = new Error('HTTP ' + r.status);
        err.status = r.status;
        err.body = parsed;
        throw err;
      });
    }
    return r.json();
  });
}
/* 调用后端 RPC（口令在后端校验，不暴露在前端） */
function callFunction(name, params){
  var action = name.replace('admin','').toLowerCase();
  var body = { p_action: action, p_password: params.password };
  if (params.id) body.p_id = params.id;
  if (params.status !== undefined) body.p_status = params.status;
  if (params.reply !== undefined) body.p_reply = params.reply;
  return cloudPost('/rest/v1/rpc/admin_action', JSON.stringify(body)).then(function(res){
    if (res === 'wrong_password') {
      var err = new Error('wrong password');
      err.body = { error: '口令错误' };
      throw err;
    }
    return { ok: true, result: res };
  });
}
function normalizeItem(o){
  return {
    id: o.id,
    no: o.no || '',
    gameId: o.gameId || '',
    type: o.type || 'other',
    description: o.description || '',
    occurTime: o.occurTime || '',
    contact: o.contact || '',
    status: o.status || 'pending',
    reply: o.reply || '',
    images: o.images || [],
    createdAt: o.created_at || ''
  };
}
function createdAtToTs(item){
  if (item._ts) { return item._ts; }
  var raw = item.createdAt;
  if (typeof raw === 'string') {
    var ts = Date.parse(raw);
    if (!isNaN(ts)) { return ts; }
    return 0;
  }
  return raw ? new Date(raw).getTime() : 0;
}

function fetchAll(){
  if (isCloud()) {
    return cloudGet('/rest/v1/Feedback?select=*&order=created_at.desc&limit=500').then(function(res){
      return (res || []).map(normalizeItem);
    });
  }
  return Promise.resolve(localList());
}
function saveOne(obj){
  if (isCloud()) {
    var hdrs = Object.assign({}, cloudHeaders(), { 'Prefer': 'return=representation' });
    return cloudPost('/rest/v1/Feedback', JSON.stringify(obj), hdrs).then(function(res){
      var it = normalizeItem(res[0]);
      it.no = it.no || obj.no;
      it._ts = Date.now();
      return it;
    });
  }
  return new Promise(function(resolve, reject){
    try {
      var list = localList();
      var now = Date.now();
      var it = {
        id: 'L' + now + Math.floor(Math.random() * 1000),
        no: obj.no,
        gameId: obj.gameId,
        type: obj.type,
        description: obj.description,
        occurTime: obj.occurTime || '',
        contact: obj.contact || '',
        status: 'pending',
        reply: '',
        images: obj.images || [],
        createdAt: now,
        _ts: now
      };
      list.unshift(it);
      localStorage.setItem('tstfb_local', JSON.stringify(list));
      resolve(it);
    } catch (e) {
      reject(e);
    }
  });
}
function updateOne(id, patch){
  if (isCloud()) {
    var pwd = sessionStorage.getItem('tstfb-admin-pwd') || '';
    return callFunction('adminUpdate', {
      id: id, password: pwd,
      status: patch.status, reply: patch.reply
    });
  }
  return new Promise(function(resolve, reject){
    try {
      var list = localList();
      var hit = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) { hit = list[i]; break; }
      }
      if (!hit) { return reject(new Error('not found')); }
      for (var k in patch) { if (patch.hasOwnProperty(k)) { hit[k] = patch[k]; } }
      localStorage.setItem('tstfb_local', JSON.stringify(list));
      resolve(hit);
    } catch (e) { reject(e); }
  });
}
function localList(){

      resolve({ ok: true });
    } catch (e) { reject(e); }
  });
}

  return Promise.resolve(img.dataUrl);
}

/* ================================================================
 * 图片压缩
 * ================================================================ */
function compressImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var MAX_SIDE = 800;
        var scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        canvas.toBlob(function(blob){
          resolve({ name: file.name, dataUrl: dataUrl, blob: blob });
        }, 'image/jpeg', 0.7);
      };
      img.onerror = function(){ reject(new Error('img load fail')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('read fail')); };
    reader.readAsDataURL(file);
  });
}

  var remain = MAX_IMAGES - pickedImages.length;
  if (files.length > remain) {
    tip.textContent = t('imgTooMany');
    tip.className = 'tip-msg error';
    return;
  }
  var badType = files.some(function(f){ return !/^image\/(jpeg|png|webp)$/.test(f.type); });
  if (badType) {
    tip.textContent = t('imgBadType');
    tip.className = 'tip-msg error';
    return;
  }
  var tooBig = files.some(function(f){ return f.size > MAX_IMG_BYTES; });
  if (tooBig) {
    tip.textContent = t('imgTooBig');
    tip.className = 'tip-msg error';
    return;
  }
  var queue = files.map(function(f){ return compressImage(f); });
  Promise.all(queue).then(function(items){
    pickedImages = pickedImages.concat(items);
    renderImgList();
    tip.textContent = '';
    tip.className = 'tip-msg';
  }).catch(function(){
    tip.textContent = t('imgProcFail');
    tip.className = 'tip-msg error';
  });
});

    document.getElementById('f-contact').value = '';
    pickedImages = [];
    renderImgList();
    tip.textContent = t('submitOk') + item.no;
    tip.className = 'tip-msg ok';
    showToast(t('submitOk') + ' ' + item.no);
    setTimeout(function(){
      location.hash = '#/detail?id=' + encodeURIComponent(item.id);
    }, 900);
  }).catch(function(){
    tip.textContent = isCloud() ? t('errCloud') : t('errSubmitFail');
    tip.className = 'tip-msg error';
  }).finally(function(){
    btn.disabled = false;
  });
});

/* ================================================================
 * 列表
 * ================================================================ */
var listCache = null;
function typeName(v){ return t('type' + v.charAt(0).toUpperCase() + v.slice(1)) || v; }
function statusName(v){
  if (v === 'pending') { return t('statusPending'); }
  if (v === 'doing') { return t('statusDoing'); }
  if (v === 'done') { return t('statusDone'); }
  return v;
}
function statusClass(v){
  if (v === 'doing') { return 'doing'; }
  if (v === 'done') { return 'done'; }
  return 'pending';
}
function renderList(){
  var wrap = document.getElementById('listWrap');
  var kw = (document.getElementById('listSearch').value || '').trim().toLowerCase();
  var fs = document.getElementById('filterStatus').value;
  var ft = document.getElementById('filterType').value;
  fetchAll().then(function(all){
    listCache = all;
    var list = all.filter(function(it){
      if (fs && it.status !== fs) { return false; }
      if (ft && it.type !== ft) { return false; }
      if (kw) {
        var hay = (it.no + ' ' + it.gameId + ' ' + it.description).toLowerCase();
        if (hay.indexOf(kw) === -1) { return false; }
      }
      return true;
    });
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">' + escapeHtml(t('listEmpty')) + '</div>';
      return;
    }
    var html = '';
    list.forEach(function(it){
      var ts = createdAtToTs(it);
      var thumbs = '';
      (it.images || []).slice(0, 3).forEach(function(u){
        thumbs += '<img src="' + escapeHtml(u) + '" alt="shot">';
      });
      html +=
        '<div class="fb-card" data-id="' + escapeHtml(it.id) + '">' +
          '<div class="fb-head">' +
            '<span class="fb-no">' + escapeHtml(it.no || it.id) + '</span>' +
            '<span class="fb-type">' + escapeHtml(typeName(it.type)) + '</span>' +
            '<span class="fb-status ' + statusClass(it.status) + '">' + escapeHtml(statusName(it.status)) + '</span>' +
            '<span class="fb-time">' + escapeHtml(fmtTime(ts)) + '</span>' +
          '</div>' +
          '<div class="fb-desc">' + escapeHtml(it.description) + '</div>' +
          (thumbs ? '<div class="fb-thumbs">' + thumbs + '</div>' : '') +
        '</div>';
    });
    wrap.innerHTML = html;
    Array.prototype.forEach.call(wrap.querySelectorAll('.fb-card'), function(card){
      card.addEventListener('click', function(){
        location.hash = '#/detail?id=' + encodeURIComponent(card.dataset.id);
      });
    });
  }).catch(function(){
    wrap.innerHTML = '<div class="empty">' + escapeHtml(t('errCloud')) + '</div>';
  });
}
document.getElementById('listSearch').addEventListener('input', function(){
  if (currentRoute === 'list') { renderList(); }
});
document.getElementById('filterStatus').addEventListener('change', function(){
  if (currentRoute === 'list') { renderList(); }
});
document.getElementById('filterType').addEventListener('change', function(){
  if (currentRoute === 'list') { renderList(); }
});

/* ================================================================
 * 详情
 * ================================================================ */
document.getElementById('detailBack').addEventListener('click', function(){
  location.hash = '#/list';
});
function renderDetail(id){
  var wrap = document.getElementById('detailWrap');
  if (!id) {
    wrap.innerHTML = '<div class="empty">' + escapeHtml(t('listEmpty')) + '</div>';
    return;
  }
  fetchAll().then(function(all){
    var it = null;
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === id) { it = all[i]; break; }
    }
    if (!it) {
      wrap.innerHTML = '<div class="empty">' + escapeHtml(t('listEmpty')) + '</div>';
      return;
    }
    var ts = createdAtToTs(it);
    var gallery = '';
    (it.images || []).forEach(function(u){
      gallery += '<img src="' + escapeHtml(u) + '" alt="shot" data-full="' + escapeHtml(u) + '">';
    });
    var replyHtml = it.reply
      ? '<div class="reply-text">' + escapeHtml(it.reply) + '</div>'
      : '<div class="reply-empty">' + escapeHtml(t('detailNoReply')) + '</div>';
    wrap.innerHTML =
      '<div class="card">' +
        '<div class="fb-head">' +
          '<span class="fb-no">' + escapeHtml(it.no || it.id) + '</span>' +
          '<span class="fb-status ' + statusClass(it.status) + '">' + escapeHtml(statusName(it.status)) + '</span>' +
        '</div>' +
        '<div class="detail-meta">' +
          '<div class="row"><span class="k">' + escapeHtml(t('detailGameId')) + '</span><span>' + escapeHtml(it.gameId) + '</span></div>' +
          '<div class="row"><span class="k">' + escapeHtml(t('detailType')) + '</span><span>' + escapeHtml(typeName(it.type)) + '</span></div>' +
          '<div class="row"><span class="k">' + escapeHtml(t('detailTime')) + '</span><span>' + escapeHtml(fmtTime(ts)) + '</span></div>' +
          (it.occurTime ? '<div class="row"><span class="k">' + escapeHtml(t('fTime')) + '</span><span>' + escapeHtml(it.occurTime) + '</span></div>' : '') +
          (it.contact ? '<div class="row"><span class="k">' + escapeHtml(t('detailContact')) + '</span><span>' + escapeHtml(it.contact) + '</span></div>' : '') +
        '</div>' +
        '<div class="detail-body">' + escapeHtml(it.description) + '</div>' +
        (gallery ? '<div class="gallery">' + gallery + '</div>' : '') +
      '</div>' +
      '<div class="card reply-box">' +
        '<div class="k">' + escapeHtml(t('detailReply')) + '</div>' +
        replyHtml +
      '</div>';
    Array.prototype.forEach.call(wrap.querySelectorAll('.gallery img'), function(im){
      im.addEventListener('click', function(){
        document.getElementById('lightboxImg').src = im.dataset.full;
        document.getElementById('lightbox').classList.add('open');
      });
    });
  }).catch(function(){
    wrap.innerHTML = '<div class="empty">' + escapeHtml(t('errCloud')) + '</div>';
  });
}

/* ================================================================
 * 灯箱
 * ================================================================ */
document.getElementById('lightbox').addEventListener('click', function(){
  this.classList.remove('open');
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    document.getElementById('lightbox').classList.remove('open');
  }
});

/* ================================================================
 * 管理
 * ================================================================ */
function renderAdmin(){
  var login = document.getElementById('adminLogin');
  var panel = document.getElementById('adminPanel');
  if (isAdmin) {
    login.style.display = 'none';
    panel.style.display = 'block';
    document.getElementById('adminWho').textContent = t('adminWho');
    renderAdminList();
  } else {
    login.style.display = 'block';
    panel.style.display = 'none';
  }
}
document.getElementById('adminLoginBtn').addEventListener('click', function(){
  var pwd = document.getElementById('adminPwd').value;
  var tip = document.getElementById('adminTip');
  tip.className = 'tip-msg';
  function ok(){
    isAdmin = true;
    if (isCloud()) { sessionStorage.setItem('tstfb-admin-pwd', pwd); }
    else { sessionStorage.setItem('tstfb-admin', '1'); }
    document.getElementById('adminPwd').value = '';
    tip.textContent = '';
    renderAdmin();
  }
  function fail(e){
    if (e && e.body && e.body.error && /口令/.test(String(e.body.error))) {
      tip.textContent = t('adminWrong');
      tip.className = 'tip-msg error';
    } else if (isCloud()) {
      tip.textContent = t('errCloud');
      tip.className = 'tip-msg error';
    } else {
      tip.textContent = t('adminWrong');
      tip.className = 'tip-msg error';
    }
  }
  if (isCloud()) {
    callFunction('adminLogin', { password: pwd }).then(ok).catch(fail);
  } else {
    if (pwd === ADMIN_PWD) { ok(); } else { fail(); }
  }
});
document.getElementById('adminLogout').addEventListener('click', function(){
  isAdmin = false;
  sessionStorage.removeItem('tstfb-admin');
  sessionStorage.removeItem('tstfb-admin-pwd');
  renderAdmin();
});
function renderAdminList(){
  var wrap = document.getElementById('adminList');
  fetchAll().then(function(all){
    if (!all.length) {
      wrap.innerHTML = '<div class="empty">' + escapeHtml(t('adminEmpty')) + '</div>';
      return;
    }
    wrap.innerHTML = '';
    all.forEach(function(it){
      var ts = createdAtToTs(it);
      var card = document.createElement('div');
      card.className = 'admin-item';
      var head = document.createElement('div');
      head.className = 'fb-head';
      head.innerHTML =
        '<span class="fb-no">' + escapeHtml(it.no || it.id) + '</span>' +
        '<span class="fb-type">' + escapeHtml(it.gameId) + ' · ' + escapeHtml(typeName(it.type)) + '</span>' +
        '<span class="fb-time">' + escapeHtml(fmtTime(ts)) + '</span>';
      var desc = document.createElement('div');
      desc.className = 'fb-desc';
      desc.textContent = it.description;
      var selRow = document.createElement('div');
      selRow.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;';
      var selLabel = document.createElement('span');
      selLabel.className = 'k';
      selLabel.style.cssText = 'font-size:13px;color:var(--text-secondary);';
      selLabel.textContent = t('detailStatus') + ': ';
      var sel = document.createElement('select');
      sel.style.cssText = 'padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px;';
      [['pending', t('statusPending')], ['doing', t('statusDoing')], ['done', t('statusDone')]].forEach(function(p){
        var op = document.createElement('option');
        op.value = p[0];
        op.textContent = p[1];
        if (it.status === p[0]) { op.selected = true; }
        sel.appendChild(op);
      });
      selRow.appendChild(selLabel);
      selRow.appendChild(sel);
      var ta = document.createElement('textarea');
      ta.placeholder = t('adminReplyPh');
      ta.value = it.reply || '';
      var save = document.createElement('button');
      save.className = 'btn save-btn';
      save.textContent = t('adminSave');
      save.addEventListener('click', function(){
        save.disabled = true;
        var run;
        if (isCloud()) {
          var pwd = sessionStorage.getItem('tstfb-admin-pwd') || '';
          run = callFunction('adminUpdate', { id: it.id, status: sel.value, reply: ta.value, password: pwd });
        } else {
          run = updateOne(it.id, { status: sel.value, reply: ta.value });
        }
        run.then(function(){
          showToast(t('adminSaved'));
        }).catch(function(e){
          if (e && e.body && e.body.error && /口令/.test(String(e.body.error))) { showToast(t('adminWrong')); }
          else { showToast(t('errCloud')); }
        }).finally(function(){
          save.disabled = false;
        });
      });
      var del = document.createElement('button');
      del.className = 'btn save-btn';
      del.textContent = t('adminDelete');
      del.style.cssText = 'min-height:36px;padding:6px 14px;color:var(--danger);border-color:var(--danger);';
      del.addEventListener('click', function(){
        if (!window.confirm(t('adminDeleteConfirm'))) { return; }
        del.disabled = true;
        var run;
        if (isCloud()) {
          var pwd = sessionStorage.getItem('tstfb-admin-pwd') || '';
          run = callFunction('adminDelete', { id: it.id, password: pwd });
        } else {
          run = deleteOne(it.id);
        }
        run.then(function(){
          showToast(t('adminDeleted'));
          renderAdminList();
        }).catch(function(e){
          if (e && e.body && e.body.error && /口令/.test(String(e.body.error))) { showToast(t('adminWrong')); }
          else { showToast(t('errCloud')); }
          del.disabled = false;
        });
      });
      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;';
      btnRow.appendChild(save);
      btnRow.appendChild(del);
      card.appendChild(head);
      card.appendChild(desc);
      card.appendChild(selRow);
      card.appendChild(ta);
      card.appendChild(btnRow);
      wrap.appendChild(card);
    });
  }).catch(function(){
    wrap.innerHTML = '<div class="empty">' + escapeHtml(t('errCloud')) + '</div>';
  });
}

/* ================================================================
 * 初始化
 * ================================================================ */
applyTheme();
applyLang();
parseHash();
})();
</script>
</body>
